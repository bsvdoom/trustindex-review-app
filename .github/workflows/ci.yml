name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build and start services
        run: docker compose up -d --build

      - name: Install Composer dependencies
        run: docker compose exec -T app composer install --no-interaction --prefer-dist

      - name: Migrate development database
        run: docker compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction

      - name: Migrate test database
        run: docker compose exec -T -e APP_ENV=test app php bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate Composer configuration
        run: docker compose exec -T app composer validate --strict

      - name: Check PHP code style
        run: docker compose exec -T app php vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Lint Symfony container
        run: docker compose exec -T app php bin/console lint:container

      - name: Lint Twig templates
        run: docker compose exec -T app php bin/console lint:twig templates

      - name: Validate test database schema
        run: docker compose exec -T -e APP_ENV=test app php bin/console doctrine:schema:validate

      - name: Run PHPUnit tests
        run: docker compose exec -T app php bin/phpunit

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services and remove CI volumes
        if: always()
        run: docker compose down -v --remove-orphans
