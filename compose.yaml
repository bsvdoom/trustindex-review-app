services:
  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: local-development-secret
      DATABASE_URL: mysql://app:local-dev-password@db:3306/app?serverVersion=8.4.0&charset=utf8mb4
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - app_var:/var/www/html/var
      - app_vendor:/var/www/html/vendor

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_PASSWORD: local-dev-password
      MYSQL_ROOT_PASSWORD: local-dev-root-password
      MYSQL_USER: app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  app_var:
  app_vendor:
  database_data:
